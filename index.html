<style>html,body{background:#ff6b1a;margin:0}
@font-face{font-family:'Archivo Black';src:url(fonts/archivo-black.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage.woff) format('woff');font-weight:400 800;font-display:swap}
@font-face{font-family:'Orbitron';src:url(fonts/orbitron.woff) format('woff');font-weight:700 900;font-display:swap}
  #splash{position:fixed;inset:0;z-index:100;background:#ff6b1a;pointer-events:none;overflow:hidden}
  .sp-svg{position:absolute;left:50%;top:50vh;top:50lvh;width:min(46vw,210px);overflow:visible;transform:translate(-50%,-50%)}
  .sp-ball{animation:spDrop .95s cubic-bezier(.55,0,.85,.45) .12s both}
  .sp-lines{animation:spLines .9s linear .12s both}
  .sp-net{transform-box:fill-box;transform-origin:50% 0;animation:spNet .55s ease-out .62s both}
  .sp-word{position:absolute;left:0;right:0;text-align:center;line-height:1;top:calc(50vh + min(28vw,128px));top:calc(50lvh + min(28vw,128px));font-family:'Archivo Black',system-ui,sans-serif;font-size:clamp(34px,11vw,52px);color:#0e0f13;letter-spacing:-1px;animation:spWord .4s ease-out 1s both}
  @keyframes spDrop{0%{transform:translateY(-120px);opacity:0}12%{opacity:1}78%{transform:translateY(70px);opacity:1}100%{transform:translateY(105px);opacity:0}}
  @keyframes spLines{0%{opacity:0}30%{opacity:1}75%{opacity:1}100%{opacity:0}}
  @keyframes spNet{0%{transform:scaleY(1)}40%{transform:scaleY(1.12) scaleX(.95)}75%{transform:scaleY(.98)}100%{transform:scaleY(1)}}
  @keyframes spWord{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
  @keyframes spOut{to{opacity:0;visibility:hidden}}
  .sp-ball{clip-path:inset(-200px -50px -200px -50px)}
  @media (prefers-reduced-motion: reduce){#splash{display:none}}
  #splash.done{animation:spOut .4s ease-in forwards}
</style>
