<div style="background:#0e0f13;padding:28px 16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif">
  <div style="max-width:420px;margin:0 auto;background:#181a21;border:1px solid #2c303b;border-radius:20px;padding:28px;color:#f4f2ee;text-align:center">
    <div style="font-size:40px">🏀</div>
    <h1 style="font-size:20px;margin:8px 0 6px">Your login code</h1>
    <p style="color:#9a9fac;font-size:14px;margin:0 0 18px">Type this code in the app to log in.</p>
    <div style="font-size:34px;font-weight:800;letter-spacing:8px;background:#20232c;border-radius:14px;padding:14px 0;color:#c8f43c">{{ .Token }}</div>
    <p style="color:#6d7280;font-size:12px;margin:18px 0 0">The code expires in 15 minutes. If you didn't ask for it, ignore this email.</p>
  </div>
</div>
